<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 960" role="img" aria-label="Call graph of the hsh shell, from main's loop down through parsing, dispatch, builtins, execution and shared utilities">
  <rect x="0" y="0" width="1320" height="960" fill="#F7F8F6"/>
