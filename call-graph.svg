      <rect x="382" y="703" width="215" height="44" rx="10"/>
      <rect x="627" y="703" width="140" height="44" rx="10"/>
      <rect x="797" y="703" width="130" height="44" rx="10"/>
      <rect x="957" y="703" width="160" height="44" rx="10"/>
